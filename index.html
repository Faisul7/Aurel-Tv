<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUREL TV - Cyber Live IPTV Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <!-- HLS.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#10b981',
                            600: '#059669',
                            900: '#064e3b'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        cyber: ['Orbitron', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(18, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.25s ease;
        }
        .glass-card:hover {
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
            transform: translateY(-1px);
        }
        .glass-card-active {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.12);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }
        .neon-glow {
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.7), 0 0 20px rgba(16, 185, 129, 0.5);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(16, 185, 129, 0.3);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(16, 185, 129, 0.6);
        }
    </style>
</head>
<body class="bg-[#030712] text-[#f8fafc] min-h-screen font-sans selection:bg-brand-500 selection:text-white flex flex-col justify-between">

    <!-- Header -->
    <header class="glass-panel sticky top-0 z-50 border-x-0 border-t-0 px-4 py-3">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center shadow-lg shadow-brand-500/30">
                    <i class="fa-solid fa-tv text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="font-cyber font-bold text-lg tracking-wider bg-gradient-to-r from-white via-emerald-200 to-brand-500 bg-clip-text text-transparent">
                        AUREL TV
                    </h1>
                    <p class="text-[10px] text-emerald-400 tracking-widest uppercase">TV.FAISUL.MY.ID</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <div id="streamStatusBadge" class="hidden sm:flex items-center space-x-1.5 px-3 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                    <span id="statusText">Stream Error</span>
                </div>
                <button onclick="openSettings()" class="w-10 h-10 rounded-xl glass-card flex items-center justify-center text-slate-300 hover:text-white hover:border-brand-500/50 transition">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl w-full mx-auto px-4 py-4 flex-grow flex flex-col space-y-4">
        
        <!-- Video Player Section -->
        <div class="glass-panel rounded-2xl overflow-hidden shadow-2xl relative">
            <div class="relative aspect-video bg-black flex items-center justify-center">
                <video id="videoPlayer" class="w-full h-full object-contain" controls autoplay playsinline></video>
                <div id="playerOverlay" class="absolute inset-0 bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center text-center p-6 transition-opacity duration-300">
                    <div class="w-16 h-16 rounded-full bg-brand-500/20 border border-brand-500/40 flex items-center justify-center text-brand-400 text-2xl mb-3 shadow-lg shadow-brand-500/20">
                        <i class="fa-solid fa-play ml-1"></i>
                    </div>
                    <h3 id="currentPlayingTitle" class="font-semibold text-lg text-white">Pilih Channel</h3>
                    <p class="text-xs text-slate-400 mt-1">Silakan pilih siaran TV di bawah untuk mulai menonton</p>
                </div>
            </div>

            <!-- Player Bar Meta -->
            <div class="p-4 flex flex-wrap items-center justify-between gap-3 border-t border-slate-800/60 bg-slate-900/40">
                <div class="flex items-center space-x-3">
                    <div id="activeLogoContainer" class="w-10 h-10 rounded-lg bg-slate-800 flex items-center justify-center p-1 border border-slate-700">
                        <i class="fa-solid fa-satellite-dish text-brand-400"></i>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <span id="activeChannelBadge" class="text-[10px] font-bold px-2 py-0.5 rounded bg-brand-500/20 text-brand-400 border border-brand-500/30">HLS Live</span>
                            <span class="text-xs text-slate-400" id="activeCategory">Siaran Langsung</span>
                        </div>
                        <h2 id="activeChannelName" class="font-bold text-white text-base mt-0.5">Belum ada channel dipilih</h2>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <button onclick="toggleSleepTimer()" id="sleepBtn" class="px-3 py-1.5 rounded-xl glass-card text-xs font-medium text-slate-300 hover:text-white flex items-center space-x-1.5">
                        <i class="fa-regular fa-moon"></i>
                        <span id="sleepText">Sleep Off</span>
                    </button>
                    <button onclick="toggleFavoriteActive()" id="favActiveBtn" class="w-9 h-9 rounded-xl glass-card flex items-center justify-center text-slate-400 hover:text-yellow-400 transition">
                        <i class="fa-regular fa-star"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Channel List Section -->
        <div class="glass-panel rounded-2xl p-4 flex flex-col space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-list-ul text-brand-400"></i>
                    <h3 class="font-bold text-sm uppercase tracking-wider text-white">Daftar Siaran TV</h3>
                    <span id="channelCount" class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-brand-400 font-medium border border-slate-700">0 Channel</span>
                </div>
                
                <!-- Search Box -->
                <div class="relative w-full sm:w-64">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </span>
                    <input type="text" id="searchInput" oninput="filterChannels()" placeholder="Cari siaran TV..." class="w-full pl-9 pr-4 py-2 bg-slate-900/80 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 transition">
                </div>
            </div>

            <!-- List Container -->
            <div id="channelList" class="grid grid-cols-1 md:grid-cols-2 gap-2.5 max-h-[450px] overflow-y-auto pr-1">
                <!-- Channel items rendered dynamically -->
                <div class="p-4 text-center text-slate-500 text-xs col-span-full">Memuat daftar channel...</div>
            </div>
        </div>

    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="glass-panel rounded-2xl max-w-md w-full p-5 border border-slate-700 flex flex-col space-y-4 shadow-2xl">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-sm text-white flex items-center space-x-2">
                    <i class="fa-solid fa-gear text-brand-400"></i>
                    <span>Pengaturan Playlist M3U</span>
                </h3>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="space-y-1.5">
                <label class="text-xs text-slate-400 font-medium">URL M3U / Web Semar:</label>
                <input type="text" id="m3uUrlInput" class="w-full px-3 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-brand-500">
            </div>

            <div class="flex items-center space-x-2 pt-2">
                <button onclick="syncPlaylist()" class="flex-1 py-2.5 px-4 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-brand-600/30 flex items-center justify-center space-x-2 transition">
                    <i class="fa-solid fa-rotate"></i>
                    <span>Sync Link</span>
                </button>
                <button onclick="document.getElementById('fileInput').click()" class="py-2.5 px-4 glass-card hover:bg-slate-800 text-slate-200 rounded-xl text-xs font-semibold flex items-center justify-center space-x-2 transition">
                    <i class="fa-solid fa-file-arrow-up"></i>
                    <span>Import File</span>
                </button>
                <input type="file" id="fileInput" accept=".m3u,.m3u8" class="hidden" onchange="importM3UFile(event)">
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-slate-900 bg-[#02040a] py-4 text-center text-[11px] text-slate-500">
        <p>&copy; 2026 AUREL TV Portal &bull; <span class="text-brand-400 font-medium">tv.faisul.my.id</span></p>
    </footer>

    <!-- Script Engine -->
    <script>
        let channels = [];
        let currentStreamUrl = '';
        let hls = null;
        let defaultM3uUrl = 'https://plsemar.pages.dev/';
        
        window.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('aurel_m3u_url') || defaultM3uUrl;
            document.getElementById('m3uUrlInput').value = savedUrl;
            loadPlaylist(savedUrl);
        });

        function openSettings() {
            document.getElementById('settingsModal').classList.remove('hidden');
            document.getElementById('settingsModal').classList.add('flex');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('flex');
            document.getElementById('settingsModal').classList.add('hidden');
        }

        async function syncPlaylist() {
            const url = document.getElementById('m3uUrlInput').value.trim();
            if (!url) return alert('Masukkan URL M3U terlebih dahulu!');
            localStorage.setItem('aurel_m3u_url', url);
            closeSettings();
            await loadPlaylist(url);
        }

        async function loadPlaylist(targetUrl) {
            const listEl = document.getElementById('channelList');
            listEl.innerHTML = `<div class="p-6 text-center text-slate-400 text-xs col-span-full"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Menarik data siaran...</div>`;
            
            // Daftar alternatif proxy CORS agar tidak gagal total jika salah satu down
            const proxyRotator = [
                'https://api.allorigins.win/raw?url=',
                'https://corsproxy.io/?',
                ''
            ];

            let m3uText = '';
            let success = false;

            for (let proxy of proxyRotator) {
                try {
                    const fetchUrl = proxy ? proxy + encodeURIComponent(targetUrl) : targetUrl;
                    const res = await fetch(fetchUrl);
                    if (res.ok) {
                        m3uText = await res.text();
                        if (m3uText.includes('#EXTINF') || m3uText.includes('http')) {
                            success = true;
                            break;
                        }
                    }
                } catch (e) {
                    console.warn('Proxy failed, trying next...', e);
                }
            }

            if (!success || !m3uText) {
                listEl.innerHTML = `<div class="p-6 text-center text-red-400 text-xs col-span-full"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Gagal menarik data. Pastikan link aktif atau coba gunakan import file M3U.</div>`;
                alert('Gagal menarik data dari URL. Silakan coba gunakan fitur Import File.');
                return;
            }

            channels = parseM3U(m3uText);
            renderChannels(channels);
            if (channels.length > 0) {
                playChannel(channels[0].url, channels[0].name, channels[0].logo, channels[0].group);
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            let parsed = [];
            let current = { name: '', logo: '', group: 'Umum', url: '' };

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    let tvgNameMatch = line.match(/tvg-name="([^"]*)"/);
                    let logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    let groupMatch = line.match(/group-title="([^"]*)"/);
                    
                    let parts = line.split(',');
                    let name = tvgNameMatch ? tvgNameMatch[1] : (parts.length > 1 ? parts[parts.length - 1].trim() : 'Channel Tanpa Nama');

                    current.name = name;
                    current.logo = logoMatch ? logoMatch[1] : '';
                    current.group = groupMatch ? groupMatch[1] : 'Live TV';
                } else if (line && !line.startsWith('#')) {
                    current.url = line;
                    if (current.name && current.url) {
                        parsed.push({ ...current });
                    }
                    current = { name: '', logo: '', group: 'Umum', url: '' };
                }
            }
            return parsed;
        }

        function renderChannels(data) {
            const listEl = document.getElementById('channelList');
            document.getElementById('channelCount').innerText = `${data.length} Channel`;

            if (data.length === 0) {
                listEl.innerHTML = `<div class="p-6 text-center text-slate-500 text-xs col-span-full">Tidak ada channel ditemukan.</div>`;
                return;
            }

            let html = '';
            data.forEach((ch, idx) => {
                let logoHtml = ch.logo 
                    ? `<img src="${ch.logo}" class="w-7 h-7 object-contain rounded" onerror="this.onerror=null;this.src='https://placehold.co/40?text=TV';">`
                    : `<i class="fa-solid fa-tv text-brand-400"></i>`;

                html += `
                    <div onclick="playChannel('${ch.url}', '${ch.name.replace(/'/g, "\\'")}', '${ch.logo}', '${ch.group}')" 
                         class="glass-card p-3 rounded-xl flex items-center justify-between cursor-pointer group hover:bg-slate-800/80 transition">
                        <div class="flex items-center space-x-3 overflow-hidden">
                            <div class="w-9 h-9 rounded-lg bg-slate-900/90 flex items-center justify-center p-1 border border-slate-700/60 flex-shrink-0">
                                ${logoHtml}
                            </div>
                            <div class="overflow-hidden">
                                <h4 class="font-semibold text-xs text-white truncate group-hover:text-brand-400 transition">${ch.name}</h4>
                                <p class="text-[10px] text-slate-400 truncate mt-0.5">${ch.group}</p>
                            </div>
                        </div>
                        <div class="w-7 h-7 rounded-full bg-brand-500/10 text-brand-400 flex items-center justify-center flex-shrink-0 ml-2 group-hover:bg-brand-500 group-hover:text-white transition">
                            <i class="fa-solid fa-play text-[10px]"></i>
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        function filterChannels() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = channels.filter(ch => ch.name.toLowerCase().includes(query) || ch.group.toLowerCase().includes(query));
            renderChannels(filtered);
        }

        function playChannel(url, name, logo, group) {
            currentStreamUrl = url;
            const video = document.getElementById('videoPlayer');
            const overlay = document.getElementById('playerOverlay');
            const badge = document.getElementById('streamStatusBadge');
            const statusText = document.getElementById('statusText');

            document.getElementById('activeChannelName').innerText = name;
            document.getElementById('activeCategory').innerText = group || 'Siaran Langsung';
            
            let logoContainer = document.getElementById('activeLogoContainer');
            if (logo) {
                logoContainer.innerHTML = `<img src="${logo}" class="w-full h-full object-contain rounded" onerror="this.onerror=null;this.src='https://placehold.co/40?text=TV';">`;
            } else {
                logoContainer.innerHTML = `<i class="fa-solid fa-satellite-dish text-brand-400"></i>`;
            }

            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 300);

            badge.className = "hidden sm:flex items-center space-x-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
            statusText.innerText = "Live Stream";

            if (Hls.isSupported() && url.includes('.m3u8')) {
                if (hls) { hls.destroy(); }
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play(); });
            } else {
                video.src = url;
                video.play();
            }
        }

        function importM3UFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                let text = e.target.result;
                channels = parseM3U(text);
                renderChannels(channels);
                closeSettings();
                if (channels.length > 0) {
                    playChannel(channels[0].url, channels[0].name, channels[0].logo, channels[0].group);
                }
            };
            reader.readAsText(file);
        }

        let sleepTimer = null;
        function toggleSleepTimer() {
            const btn = document.getElementById('sleepBtn');
            const text = document.getElementById('sleepText');
            if (!sleepTimer) {
                sleepTimer = setTimeout(() => {
                    document.getElementById('videoPlayer').pause();
                    text.innerText = "Sleep Off";
                    sleepTimer = null;
                }, 30 * 60 * 1000); // 30 Menit
                text.innerText = "Sleep (30m)";
                btn.classList.add('border-brand-500');
            } else {
                clearTimeout(sleepTimer);
                sleepTimer = null;
                text.innerText = "Sleep Off";
                btn.classList.remove('border-brand-500');
            }
        }

        function toggleFavoriteActive() {
            // Placeholder favorite toggle
        }
    </script>
</body>
</html>
